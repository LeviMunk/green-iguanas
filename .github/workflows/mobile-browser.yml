name: Mobile browser checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install site and browser test dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Build production site
        run: npm run build
      - name: Start local preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/green-iguanas-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/green-iguanas/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/green-iguanas-preview.log
          exit 1
      - name: Test mobile pages in Chromium and WebKit
        run: node scripts/mobile-browser-test.mjs
      - name: Save screenshots and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-browser-screenshots
          path: mobile-test-results/
          if-no-files-found: ignore
          retention-days: 14
